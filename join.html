<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>League beitreten – Offleague</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 80px 24px;
    line-height: 1.6;
    color: #1a2e1c;
    background: #f7faf7;
    text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { color: #16341a; margin-bottom: 8px; }
  p { color: #3a4d3c; font-size: 16px; }
  .btn { display: block; margin: 12px 0; padding: 14px 16px; border-radius: 12px; background: #2f7d3c; color: #fff; text-decoration: none; font-weight: 600; }
  .hint { color: #667; font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>

<div class="icon">🏆</div>
<h1>Du wurdest zu einer League eingeladen</h1>
<p>Lade Offleague herunter und öffne diesen Link danach erneut, um direkt beizutreten.</p>

<a class="btn" id="ios" href="https://apps.apple.com/app/id6791986449">Im App Store laden</a>
<a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.offleague.app">Bei Google Play laden</a>

<p class="hint">Hast du die App schon? Dann öffne den Einladungslink direkt auf deinem Smartphone.</p>

<script>
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  if (isIOS) {
    location.replace(document.getElementById('ios').href);
  } else if (isAndroid) {
    location.replace(document.getElementById('android').href);
  }
</script>

</body>
</html>
